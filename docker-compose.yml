version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: miniledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miniledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
